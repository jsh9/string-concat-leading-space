[tox]
envlist =
    py310
    py311
    py312
    py313
    py314
    ty
    muff-lint
    muff-format
    pydoclint
    pre-commit

[gh-actions]
python =
    3.10: py310, ty, muff-lint, muff-format, pydoclint, pre-commit
    3.11: py311, ty, muff-lint, muff-format, pydoclint, pre-commit
    3.12: py312, ty, muff-lint, muff-format, pydoclint, pre-commit
    3.13: py313, ty, muff-lint, muff-format, pydoclint, pre-commit
    3.14: py314, ty, muff-lint, muff-format, pydoclint, pre-commit

[testenv]
deps =
    pytest
commands =
    pytest --tb=long

[testenv:ty]
deps =
    ty==0.0.93
commands =
    ty check --error-on-warning string_concat_leading_space/

[testenv:muff-lint]
deps =
    muff==0.15.20
skip_install = true
commands =
    # no '--fix', so that violations fail instead of being silently fixed
    muff check --config=muff.toml string_concat_leading_space tests

[testenv:muff-format]
deps =
    muff==0.15.20
skip_install = true
commands =
    # use the '--diff' flag to avoid accidentally formatting code
    muff format --diff --config=muff.toml string_concat_leading_space tests

[testenv:pydoclint]
skip_install = true
deps =
    pydoclint
commands =
    pydoclint --check-arg-defaults=True ./string_concat_leading_space

[testenv:pre-commit]
skip_install = true
deps =
    pre-commit
set_env =
    # Skipping auto-formatter here to avoid accidentally formatting code
    SKIP = muff
commands =
    pre-commit run -a
